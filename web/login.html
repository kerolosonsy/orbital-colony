<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="orbital-token" content="__ORBITAL_TOKEN__">
<meta name="theme-color" content="#17142a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e8734a'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%23f2c14e' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
<title>Orbital Colony — ادخل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">
<main class="login">
  <section class="login-sheet" aria-labelledby="login-title">
    <header class="login-head">
      <svg class="login-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="9" fill="var(--survey)"/><ellipse cx="16" cy="16" rx="15" ry="5" fill="none" stroke="var(--star)" stroke-width="2" transform="rotate(-20 16 16)"/></svg>
      <div>
        <p class="login-brand">ORBITAL COLONY</p>
        <p class="login-coords" dir="ltr">KEPLER-G · SURVEY ACCESS</p>
      </div>
      <button type="button" id="login-lang" class="tool small login-lang">English</button>
    </header>

    <h1 id="login-title" data-en="Sign in to keep surveying">ادخل وكمّل المسح</h1>
    <p class="login-lede" data-en="One account holds all your players: each with their own stars, code and colony.">حساب واحد فيه كل اللاعبين بتوعك، وكل لاعب ليه نجومه وكوده ومستعمرته.</p>

    <div id="google-box" class="login-google">
      <a id="google-link" class="tool wide google-btn" href="/auth/google">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.7V6.6h-4a12 12 0 0 0 0 10.9l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
        <span data-en="Continue with Google">كمّل بحساب Google</span>
      </a>
      <small class="login-note" data-en="Signs you in, or makes your account the first time.">بيدخّلك، أو بيعملك حساب لو أول مرة.</small>
      <small id="google-invite-note" class="login-note" hidden data-en="New here? Type your invite code under &quot;New account&quot; first.">جديد؟ اكتب كود الدعوة في "حساب جديد" الأول.</small>
      <span class="login-or" data-en="or with email">أو بالإيميل</span>
    </div>

    <div class="login-tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true" data-en="Sign in">دخول</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false" data-en="New account">حساب جديد</button>
    </div>

    <form id="login-form" class="login-form" novalidate>
      <label class="signup-only" hidden><span data-en="Your name">اسمك</span>
        <input id="f-name" name="name" maxlength="40" autocomplete="name"></label>
      <label><span data-en="Email">الإيميل</span>
        <input id="f-email" name="email" type="email" dir="ltr" required autocomplete="email"></label>
      <label><span data-en="Password">الباسورد</span>
        <input id="f-password" name="password" type="password" dir="ltr" required minlength="8" autocomplete="current-password">
        <small class="signup-only" hidden data-en="8 characters or more.">٨ حروف أو أكتر.</small></label>
      <label class="signup-only" hidden><span data-en="Invite code">كود الدعوة</span>
        <input id="f-invite" name="invite" dir="ltr" autocomplete="off" spellcheck="false"></label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-submit" class="run big" type="submit"><span id="submit-label" data-en="Sign in">ادخل</span></button>
    </form>

  </section>
</main>
<script src="/static/login.js"></script>
</body>
</html>
