name: Bug report
description: Report a reproducible problem in the game, demo, or tools
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Include the commit, OS, Go version, browser, or demo URL as relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the mission ID or screen and the smallest example that shows the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Redact personal data and secrets from logs and screenshots.
    validations:
      required: true
