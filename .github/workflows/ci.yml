name: Checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            go.sum
            labdeps/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Prepare optional lab dependencies
        run: make deps
      - name: Vet Go packages
        run: make vet
      - name: Test the Go game and curriculum
        run: make test
      - name: Test the browser code
        run: make test-web
      - name: Build the demo
        run: make demo

  audit:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            go.sum
            labdeps/go.sum
      - name: Scan the game and curriculum
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
          cd colony
          govulncheck ./...
