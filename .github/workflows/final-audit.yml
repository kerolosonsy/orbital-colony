name: Final release dependency and history scan
"on":
  push:
    branches: ["release/verify-open-source"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Scan the game, curriculum, and labs
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck -show=verbose ./...
          (cd colony && govulncheck -show=verbose ./...)
          (cd labdeps && go mod download all && govulncheck -show=verbose ./...)
      - name: Check Git history for unexpected secret findings
        if: always()
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          status=0
          gitleaks git --redact=100 --log-opts="--all" --no-banner --report-format=json --report-path="${RUNNER_TEMP}/release-secrets.json" . || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          if [ ! -f "${RUNNER_TEMP}/release-secrets.json" ]; then exit "$status"; fi
          jq -e 'map(select((.RuleID == "generic-api-key" and (.Commit | startswith("3f59d04c9e9b")) and ((.File == "colony/levels/ch28_lessons_test.go" and (.StartLine == 17 or .StartLine == 277)) or (.File == "colony/levels/ch29_lessons_test.go" and .StartLine == 261))) | not)) | length == 0' "${RUNNER_TEMP}/release-secrets.json"
