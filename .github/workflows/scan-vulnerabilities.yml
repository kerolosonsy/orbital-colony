name: Release Go vulnerability scan
"on":
  push:
    branches: ["release/verify-open-source"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Install the Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Scan the game
        run: govulncheck ./...
      - name: Scan the curriculum
        if: always()
        working-directory: colony
        run: govulncheck ./...
