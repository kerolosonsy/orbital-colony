name: Dependency advisory details
"on":
  push:
    branches: ["release/verify-open-source"]
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Check dependencies and reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck -show=verbose ./...
      - name: Check optional lab dependencies
        if: always()
        working-directory: labdeps
        run: |
          go mod download all
          govulncheck -show=verbose ./...
