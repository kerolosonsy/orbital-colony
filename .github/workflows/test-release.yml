name: Final Linux release validation
"on":
  push:
    branches: ["release/verify-open-source"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Resolve patched module versions and export checksums
        run: |
          go get go.opentelemetry.io/otel@v1.47.0
          go mod tidy
          (cd labdeps && go get github.com/quic-go/quic-go@v0.59.1 && go mod download all)
          for module_file in go.mod go.sum labdeps/go.mod labdeps/go.sum; do
            printf 'ORBITAL_EXPORT_BEGIN %s\n' "$module_file"
            base64 --wrap=512 "$module_file"
            printf 'ORBITAL_EXPORT_END %s\n' "$module_file"
          done
      - name: Verify dependencies and scan each module
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go mod verify
          govulncheck -show=verbose ./...
          (cd colony && govulncheck -show=verbose ./...)
          (cd labdeps && go mod verify && govulncheck -show=verbose ./...)

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [game, missions-early, missions-late, lessons-web]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            go.sum
            labdeps/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.suite == 'lessons-web'
        with:
          node-version: "24"
      - name: Use patched Go dependencies
        run: |
          go get go.opentelemetry.io/otel@v1.47.0
          go mod tidy
          (cd labdeps && go get github.com/quic-go/quic-go@v0.59.1)
      - name: Prepare lab modules
        if: matrix.suite != 'lessons-web'
        run: make deps
      - name: Run game server and integration tests
        if: matrix.suite == 'game'
        run: go test -v ./cmd/orbital -skip '^TestLevelsSolvable$' -count=1 -timeout 24m
      - name: Verify missions and labs in chapters 1 to 23
        if: matrix.suite == 'missions-early'
        run: go test -v ./cmd/orbital -run '^TestLevelsSolvable$/^([1-9]|1[0-9]|2[0-3])-' -count=1 -timeout 24m
      - name: Verify missions and labs in chapters 24 to 38
        if: matrix.suite == 'missions-late'
        run: go test -v ./cmd/orbital -run '^TestLevelsSolvable$/^(2[4-9]|3[0-8])-' -count=1 -timeout 24m
      - name: Verify lessons and browser behavior
        if: matrix.suite == 'lessons-web'
        run: |
          make vet
          (cd colony && go test ./...)
          go test ./cmd/lesson-demo
          make test-web demo
