name: Verify the publication candidate
"on":
  push:
    branches: ["release/verify-open-source"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify changed Go behavior
        run: |
          go test ./cmd/orbital -count=1 -run '^TestDeadlockStarterAndLockOrderFix$' -timeout 3m
          go test ./cmd/orbital -run '^TestLevelsSolvable$/^12-3-' -count=1 -timeout 3m
          (cd colony && go test ./levels -run '^TestCh12' -count=1)
      - name: Check configuration and the browser build
        run: |
          make vet
          go test ./cmd/lesson-demo
          make test-web demo
