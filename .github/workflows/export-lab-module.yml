name: Export verified module files
"on":
  push:
    branches: ["release/verify-open-source"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Resolve the tested dependency versions
        working-directory: labdeps
        run: |
          go get github.com/valyala/fasthttp@v1.80.0
          go mod download all
          go mod verify
      - name: Export the module paths and checksums
        working-directory: labdeps
        run: |
          for module_file in go.mod go.sum; do
            printf 'ORBITAL_EXPORT_BEGIN %s\n' "$module_file"
            base64 --wrap=512 "$module_file"
            printf 'ORBITAL_EXPORT_END %s\n' "$module_file"
          done
